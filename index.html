<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- First paint in the user's theme, before any CSS or JS module loads.
         Reads the key ThemeContext.tsx writes (vd_theme) and the two page
         backgrounds from src/theme/tokens.ts (bg) — change them together.
         Without it the first frame is the browser's default white (or, for a
         light-mode user, a dark frame), which read as a flash on the way in
         from vellon.ca. Inline scripts are allowed by vercel.json's CSP. -->
    <script>
      (function () {
        var t = "dark";
        try { if (localStorage.getItem("vd_theme") === "light") t = "light"; } catch (e) {}
        var d = document.documentElement;
        d.dataset.theme = t;
        d.style.colorScheme = t;
        d.style.background = t === "light" ? "#F5F5F4" : "#111113";
      })();
    </script>

    <title>Vellon Dispatch</title>

    <!-- Fonts load from the document head, not from a <style> tag rendered by
         LoginPage. That path serialised badly: JS had to download, mount React
         and render the page before the font request even started, so the type
         visibly re-flowed after everything else had settled. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@600;700&display=swap"
    />

    <style>
      body { font-family: 'Inter', system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
